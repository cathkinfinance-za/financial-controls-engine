name: Process Approval Replies Engine

on:
  schedule:
    # Runs every 15 minutes between 4 AM and 4 PM UTC
    - cron: '*/15 4-16 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI for testing

jobs:
  process-replies:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install psycopg2-binary

      - name: Execute Reply Ingestion
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          IMAP_SERVER: ${{ secrets.IMAP_SERVER }}
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          SENDER_PASSWORD: ${{ secrets.SENDER_PASSWORD }}
        run: |
          python 3_process_replies_postgres.py